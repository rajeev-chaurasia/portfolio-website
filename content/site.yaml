bio: "I build agentic systems and the developer infrastructure they run on. I’m a Software Engineering graduate student at San Jose State University and an NVIDIA Certified Professional in Agentic AI. This summer I built CI infrastructure for NVIDIA’s Omniverse simulation pipelines, and before that I spent two and a half years at Tekion Corp on enterprise accounting and payment systems. I also contribute to RocketRide, an open-source AI pipeline engine with a C++ core, where I work on the agent loop, RAG grounding and MCP tooling. Most of what I build ships with an evaluation harness and a control group."
